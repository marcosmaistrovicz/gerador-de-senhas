<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="" alt="cadeado fechado">
            <h2> Gerador de senhas </h2>
            <h3>Gere instantaneamente uma Senha aleatoria e segura</h3>
        </div>
        <div> <class class="conteudo-senha">
            <label for="senha">Senha</label>
            <input name="senha" type="text" id="campo-senha">

        </class></div>
        <div class="parametro">
            <h3><class class="parametro-titulo">"Personalize a sua senha"</h3>
                <div>parametro-coluna__senha>
                    <div class="parametro-senha">
                        <h4 class="parametro-coluna__senha">numero de caracteres</h4>
                        <div class="parametro-senha-botoes">
                            <button class="parametro-senha__botao">-</button>
                            <p class="parametro-senha__texto">12</p>
                            <button class="parametro-senha__botao">+</button>
                        </div>
                    </div>
                    <div class="parametro-senha">
                        <h4 class="parametro-senha__titulo">Caracteristivas da Senha</h4>
                        <div class="parametro-senha-checkbox">
                            <input name="maiusculo" type="checkbox" checked>
                            <label for="maiusculo">Letras Maiusculas</label>
                        </div>
                        <div class="parametro-senha-checkbox">
                            <input name="minusculo" type="checkbox" checked>
                            <label for="mainusculo">Letras Minusculas</label>
                        </div>
                        <div class="parametro-senha-checkbox">
                            <input name="numero" type="checkbox" checked>
                            <label for="numero">Numeros</label>
                        </div>
                        <div class="parametro-senha-checkbox">
                            <input name="simbolo" type="checkbox" checked>
                            <label for="simbolo">Simbolos</label>
                        </div>
                    </div>
                    <div class="parametro-senha">
                        <h4 class="parametro-senha__titulo">Força da Senha</h4>
                    </div>
                </div>
        </div>
    </section>
</body>
</html>
